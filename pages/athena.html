<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acesse o Athena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="card">

      <div class="logo">
        <img src="logo.png" alt="Logo da athena">
      </div>

      <h1>Acesse o Athena</h1>
      <p class="subtitle">Plataforma de acompanhamento e evolução física</p>

      <form>
        <label>E-mail</label>
        <input type="email" placeholder="Digite seu e-mail">

        <div class="password-row">
          <label>Senha</label>
          <a href="#">Esqueceu a senha?</a>
        </div>
        <input type="password" placeholder="Digite sua senha">

        <p class="login-type">Entrar como:</p>

        <div class="toggle">
          <button type="button" class="active">Professor</button>
          <button type="button">Aluno</button>
        </div>

        <button class="submit">Entrar no sistema →</button>
      </form>

    </div>
  </div>

</body>
</html>
