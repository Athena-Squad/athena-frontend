<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athena | Login</title>
    
    <!-- Linkando o CSS -->
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>

    <div class="container">
    <div class="card">

      <div class="logo">
        <svg class="dumbbell-icon" viewBox="0 0 64 40" role="img" aria-label="Halter">
          <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 2">
            <path d="M18 20h28" />
            <path d="M14 12h4v16h-4zM8 15h6v10H8zM5 18h3v4H5z" />
            <path d="M46 12h4v16h-4zM50 15h6v10h-6zM56 18h3v4h-3z" />
          </g>
        </svg>
      </div>

      <h1>Acesse o Athena</h1>
      <p class="subtitle">Plataforma de acompanhamento e evolução física</p>

      <form id="form-login">
        <label>E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>

        <div class="password-row">
          <label>Senha</label>
          <a href="#">Esqueceu a senha?</a>
        </div>
       <input type="password" id="senha" placeholder="Digite sua senha" required>
        <p class="login-type">Entrar como:</p>

        <div class="toggle">
          <button type="button" class="active">Professor</button>
          <button type="button">Aluno</button>
        </div>

        <button type = "submit" class="submit">Entrar no sistema →</button>
      </form>

    </div>
  </div>

    <!-- Linkando o JavaScript no final do body para carregar mais rápido -->
    <script src="./js/mock-login.js"></script>
</body>
</html>
