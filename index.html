<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athena | Login</title>
    
    <!-- Linkando o CSS -->
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>

    <div class="container">
    <div class="card">

      <div class="logo">
        <svg class="dumbbell-icon" viewBox="0 0 64 40" role="img" aria-label="Halter">
          <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 2">
            <path d="M18 20h28" />
            <path d="M14 12h4v16h-4zM8 15h6v10H8zM5 18h3v4H5z" />
            <path d="M46 12h4v16h-4zM50 15h6v10h-6zM56 18h3v4h-3z" />
          </g>
        </svg>
      </div>

      <h1>Acesse o Athena</h1>
      <p class="subtitle">Plataforma de acompanhamento e evolução física</p>

      <form id="form-login">
        <label>E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>

        <div class="password-row">
          <label>Senha</label>
          <a href="#">Esqueceu a senha?</a>
        </div>
       <input type="password" id="senha" placeholder="Digite sua senha" required>
        <p class="login-type">Entrar como:</p>

        <div class="toggle">
          <button type="button" class="active">Professor</button>
          <button type="button">Aluno</button>
        </div>

        <button type = "submit" class="submit">Entrar no sistema →</button>
      </form>
      <a class="form-link" href="./cadastro.html">Não tem conta? Cadastre-se como aluno</a>

    </div>
  </div>

<!-- Script de Autenticação e Registro no Supabase -->
    <script type="module">
        // 1. OS IMPORTS DEVEM FICAR NO TOPO ABSOLUTO DO SCRIPT
        import { fazerLogin, obterPerfilLogado } from './js/api.js';
        import { supabase } from './js/supabase-client.js';

        document.addEventListener("DOMContentLoaded", () => {
            // Lógica do Toggle (Alternar entre Professor e Aluno)
            const toggleButtons = document.querySelectorAll('.toggle button');
            toggleButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    toggleButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                });
            });

            // Lógica do Login Real
            const formLogin = document.getElementById('form-login');
            
            if (formLogin) {
                formLogin.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const emailInput = document.getElementById('email').value;
                    const senhaInput = document.getElementById('senha').value;
                    const tipoUsuario = document.querySelector('.toggle button.active').innerText.trim().toLowerCase();
                    const btnSubmit = formLogin.querySelector('.submit');

                    const textoOriginal = btnSubmit.innerText;
                    btnSubmit.innerText = "Autenticando...";
                    btnSubmit.style.opacity = "0.7";
                    btnSubmit.disabled = true;

                    try {
                        await fazerLogin(emailInput, senhaInput);
                        const sessao = await obterPerfilLogado();
                        if (!sessao) throw new Error('Não foi possível obter o perfil da conta autenticada.');
                        const tipoReal = String(sessao.perfil.tipo_perfil || '').toLowerCase();
                        if (tipoUsuario !== tipoReal) {
                            await supabase.auth.signOut();
                            throw new Error(`Esta conta é do tipo ${tipoReal || 'não definido'}. Selecione o tipo correto para entrar.`);
                        }

                        if (tipoReal === 'professor') {
                            window.location.href = './pages/base-alunos.html'; 
                        } else if (tipoUsuario === 'aluno') {
                            window.location.href = './pages/painel-aluno.html';
                        }
                    } catch (error) {
                        alert(error.message.startsWith('Esta conta é do tipo') ? error.message : "Erro ao fazer login: " + error.message);
                        console.error("Falha na autenticação:", error);
                        
                        btnSubmit.innerText = textoOriginal;
                        btnSubmit.style.opacity = "1";
                        btnSubmit.disabled = false;
                    }
                });
            }
        });
    </script>

</body>
</html>
